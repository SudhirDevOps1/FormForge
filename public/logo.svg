<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FormForge Logo</title>
  <desc id="desc">A modern forged kinetic F mark with glowing cyber shield and energy spark.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ff-bg" x1="40" y1="30" x2="480" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="45%" stop-color="#050814" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>

    <!-- Specular Border Gradient -->
    <linearGradient id="ff-border" x1="20" y1="20" x2="490" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="25%" stop-color="#818CF8" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.45" />
    </linearGradient>

    <!-- Radial Ambient Glow -->
    <radialGradient id="ff-glow" cx="256" cy="235" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.4" />
      <stop offset="55%" stop-color="#4F46E5" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <!-- Shield Glow Gradient -->
    <linearGradient id="shield-grad" x1="160" y1="90" x2="352" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="shield-stroke" x1="160" y1="90" x2="352" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.06" />
    </linearGradient>

    <!-- Top Wing Gradient -->
    <linearGradient id="top-wing" x1="160" y1="130" x2="380" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="30%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Middle Wing Gradient -->
    <linearGradient id="mid-wing" x1="190" y1="220" x2="340" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Stem Gradient -->
    <linearGradient id="stem-grad" x1="160" y1="130" x2="240" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#0284C7" />
      <stop offset="75%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Accent Spark Gradient -->
    <linearGradient id="spark-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Drop Shadow Filter for 3D Depth -->
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0284C7" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <filter id="shadow-layer" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#ff-bg)" />
  <rect x="2.5" y="2.5" width="507" height="507" rx="117.5" stroke="url(#ff-border)" stroke-width="3" fill="none" />

  <!-- Ambient Backlight Glow -->
  <circle cx="256" cy="240" r="185" fill="url(#ff-glow)" />

  <!-- Futuristic Cyber Shield Watermark -->
  <path d="M256 86 L384 138 V246 C384 326 330 396 256 426 C182 396 128 326 128 246 V138 Z"
        fill="url(#shield-grad)"
        stroke="url(#shield-stroke)"
        stroke-width="2"
        stroke-linejoin="round" />

  <!-- Subtle Tech Coordinate Lines -->
  <path d="M256 96 V416 M138 246 H374" stroke="#38BDF8" stroke-opacity="0.07" stroke-width="1.5" stroke-dasharray="4 6" />

  <!-- The "FormForge" Master Monogram -->
  <g filter="url(#shadow-main)">
    <!-- Vertical Anchor Spine -->
    <path d="M 172 144
             C 172 134 180 126 190 126
             H 226
             C 236 126 244 134 244 144
             V 348
             C 244 362 232 374 218 374
             L 194 374
             C 181 374 172 364 172 352
             Z"
          fill="url(#stem-grad)" />

    <!-- Top Aerodynamic Forged Wing -->
    <path d="M 172 154
             C 172 138 185 126 201 126
             H 342
             C 358 126 370 140 367 156
             L 361 178
             C 359 187 351 194 341 194
             H 232
             C 220 194 210 204 210 216
             V 218
             H 188
             C 179 218 172 211 172 202
             Z"
          fill="url(#top-wing)" />

    <!-- Top Wing Specular Light Beam -->
    <path d="M 198 136 H 338 C 348 136 356 144 354 154 L 350 166 C 349 170 344 174 338 174 H 224 C 210 174 200 164 198 150 Z"
          fill="#FFFFFF"
          opacity="0.4" />

    <!-- Middle Forged Wing (Floating with Depth) -->
    <g filter="url(#shadow-layer)">
      <path d="M 198 238
               C 198 226 208 216 220 216
               H 308
               C 322 216 333 228 330 242
               L 326 260
               C 324 268 317 274 308 274
               H 220
               C 208 274 198 264 198 252
               Z"
            fill="url(#mid-wing)" />

      <!-- Middle Wing Highlight -->
      <path d="M 218 224 H 304 C 312 224 318 230 316 238 L 314 246 C 313 250 309 253 304 253 H 220 Z"
            fill="#FFFFFF"
            opacity="0.3" />
    </g>

    <!-- Lightning / Forge Fusion Notch -->
    <path d="M 224 274 L 200 322 H 234 L 214 366 L 264 302 H 232 L 246 274 Z"
          fill="#38BDF8"
          stroke="#090E1A"
          stroke-width="2.5"
          stroke-linejoin="round"
          filter="url(#shadow-layer)" />

    <!-- 4-Point Forge Energy Spark (Top Right) -->
    <path d="M 382 124
             C 382 135 388 141 399 141
             C 388 141 382 147 382 158
             C 382 147 376 141 365 141
             C 376 141 382 135 382 124 Z"
          fill="url(#spark-grad)" />
    <circle cx="382" cy="141" r="3.5" fill="#FFFFFF" />
  </g>
</svg>
