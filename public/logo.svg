<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="formforge-title formforge-desc">
  <title id="formforge-title">FormForge Logo</title>
  <desc id="formforge-desc">Geometric kinetic anvil and shield mark for FormForge.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="60" y1="40" x2="450" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="border-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#818CF8" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.6" />
    </linearGradient>

    <!-- Core Cyan/Indigo Wing Gradient -->
    <linearGradient id="primary-flow" x1="140" y1="120" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="85%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>

    <!-- Upper Anvil Beam Gradient -->
    <linearGradient id="top-beam" x1="140" y1="130" x2="390" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="25%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Center Pulse Glow -->
    <radialGradient id="center-glow" cx="256" cy="240" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#4F46E5" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="forge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Base Squircle with Glowing Specular Border -->
  <rect width="512" height="512" rx="116" fill="url(#bg-grad)" />
  <rect x="2.5" y="2.5" width="507" height="507" rx="113.5" stroke="url(#border-grad)" stroke-width="3" fill="none" />

  <!-- Ambient Glow Behind Monogram -->
  <circle cx="256" cy="240" r="175" fill="url(#center-glow)" />

  <!-- Outer Cyber Shield Crest Lines -->
  <path d="M256 84 L384 136 V244 C384 326 328 398 256 428 C184 398 128 326 128 244 V136 Z"
        stroke="#38BDF8"
        stroke-opacity="0.18"
        stroke-width="2"
        stroke-linejoin="round"
        fill="none" />

  <!-- The Master Monogram: Kinetic Forged "F" + Digital Anvil -->
  <g filter="url(#forge-shadow)">
    <!-- Vertical Spine Base -->
    <path d="M168 136 C168 127 175 120 184 120 H220 C229 120 236 127 236 136 V356 C236 367 225 376 214 376 H190 C178 376 168 366 168 354 Z"
          fill="url(#primary-flow)" />

    <!-- Top Aerodynamic Forged Anvil Beam -->
    <path d="M168 148 C168 132 181 120 197 120 H344 C358 120 369 132 366 146 L360 172 C358 181 350 188 340 188 H228 C216 188 206 198 206 210 V212 H184 C175 212 168 205 168 196 Z"
          fill="url(#top-beam)" />

    <!-- Top Beam Specular Light Beam -->
    <path d="M196 130 H340 C348 130 354 136 352 144 L348 156 C347 160 343 164 338 164 H220 C208 164 198 154 196 142 Z"
          fill="#FFFFFF"
          opacity="0.45" />

    <!-- Middle Floating Kinetic Wing -->
    <path d="M196 232 C196 221 205 212 216 212 H310 C322 212 332 222 329 234 L325 252 C323 260 316 266 308 266 H216 C205 266 196 257 196 246 Z"
          fill="url(#primary-flow)" />

    <!-- Middle Wing Specular Light Beam -->
    <path d="M214 220 H304 C310 220 315 225 313 231 L311 239 C310 243 306 246 302 246 H216 Z"
          fill="#FFFFFF"
          opacity="0.3" />

    <!-- Lightning Fusion Energy Notch -->
    <path d="M220 268 L196 314 H230 L210 358 L262 296 H228 L242 268 Z"
          fill="#38BDF8"
          stroke="#090D16"
          stroke-width="2"
          stroke-linejoin="round" />

    <!-- 4-Point High-Precision Energy Star (Top Right) -->
    <path d="M380 120 C380 130 386 136 396 136 C386 136 380 142 380 152 C380 142 374 136 364 136 C374 136 380 130 380 120 Z"
          fill="#BAE6FD" />
    <circle cx="380" cy="136" r="3" fill="#FFFFFF" />
  </g>
</svg>