<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FormForge — Interactive Test Playground</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at top, #0f172a, #020617);
      color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(13, 17, 30, 0.7);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 16px 48px -8px rgba(0, 0, 0, 0.5);
    }
    h2 {
      margin-top: 0;
      color: #38bdf8;
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 13px;
      color: #9ca3af;
      text-align: center;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #9ca3af;
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      color: white;
      font-size: 14px;
      transition: all 0.2s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
    }
    .setup-box {
      border: 1px dashed rgba(56, 189, 248, 0.3);
      background: rgba(56, 189, 248, 0.03);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #38bdf8;
      border: none;
      color: #020617;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      margin-top: 8px;
    }
    button:hover {
      background: #0ea5e9;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
    }
    .status-box {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
      border: 1px solid transparent;
    }
    .status-box.success {
      display: block;
      background: rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }
    .status-box.error {
      display: block;
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>FormForge Playground</h2>
    <p class="subtitle">Enter your endpoint URL below to safely test form submissions</p>

    <!-- Endpoint configuration (Not hardcoded/committed with credentials) -->
    <div class="setup-box">
      <div class="form-group" style="margin-bottom: 0;">
        <label for="endpoint-url">⚙️ Your Submission Endpoint URL</label>
        <input type="text" id="endpoint-url" placeholder="https://your-domain.workers.dev/api/submit/endpoint_..." value="">
      </div>
    </div>

    <!-- Active Form -->
    <form id="test-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="user@example.com" required>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" placeholder="Hello, FormForge is working!" required></textarea>
      </div>

      <!-- Honeypot trap field (hidden from users, bot protection) -->
      <input type="text" name="website" autocomplete="off" style="display:none !important" tabindex="-1">

      <button type="submit" id="submit-btn">Send Test Submission</button>
    </form>

    <div id="status" class="status-box"></div>
  </div>

  <script>
    const form = document.getElementById('test-form');
    const endpointInput = document.getElementById('endpoint-url');
    const statusBox = document.getElementById('status');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const endpoint = endpointInput.value.trim();
      if (!endpoint) {
        statusBox.className = 'status-box error';
        statusBox.textContent = '❌ Please enter your Submission Endpoint URL first.';
        statusBox.style.display = 'block';
        return;
      }

      statusBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      try {
        const formData = new FormData(form);
        const payload = {};
        formData.forEach((value, key) => {
          payload[key] = value;
        });

        const res = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        
        if (res.ok && data.ok) {
          statusBox.className = 'status-box success';
          statusBox.innerHTML = `<strong>✓ Success!</strong><br>Submission received: ${data.message || 'Accepted'}<br>ID: ${data.submissionId}`;
        } else {
          statusBox.className = 'status-box error';
          statusBox.innerHTML = `<strong>❌ Error (${res.status})</strong><br>${data.message || 'Failed to submit form.'}`;
        }
      } catch (err) {
        statusBox.className = 'status-box error';
        statusBox.innerHTML = `<strong>⚠️ Network Error</strong><br>Could not reach the server. Make sure the Endpoint URL is correct and CORS is allowed.`;
      } finally {
        statusBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Test Submission';
      }
    });
  </script>

</body>
</html>
