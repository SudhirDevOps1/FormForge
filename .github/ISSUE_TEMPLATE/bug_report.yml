name: Bug Report
description: Report a bug or unexpected behavior in FormForge
title: 'fix: '
labels: [bug, needs-triage]
assignees:
  - SudhirDevOps1
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill out the form below.
  - type: input
    id: version
    attributes:
      label: FormForge Version
      description: Which version of FormForge are you using?
      placeholder: e.g. v1.2.0
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Type
      options:
        - Cloudflare Workers (wrangler deploy)
        - Local development (npm run dev)
        - Other
    validations:
      required: true
  - type: textarea
    id: describe
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Configure form with ...
        2. Submit form with ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Messages
      description: Paste any relevant error output. Do NOT include secrets or API keys.
      render: text
  - type: checkboxes
    id: security-check
    attributes:
      label: Security Check
      options:
        - label: This bug report does NOT contain secrets, API keys, or personal data
          required: true
        - label: This is not a security vulnerability (use Private Vulnerability Reporting instead)
          required: true
