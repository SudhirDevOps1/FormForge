# FormForge Dependency Update — weekly automated dependency bump with auto-PR.
name: Dependency Update

on:
  schedule:
    - cron: '0 9 * * 1'   # Monday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    name: npm update & Auto-PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install current dependencies
        run: npm ci --no-audit --no-fund

      - name: Update minor/patch dependencies
        run: |
          npm update --save
          npm audit fix --audit-level=high || true

      - name: Run security test suite to validate updates
        run: npm run test:security

      - name: Run typecheck to validate updates
        run: npm run typecheck

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request with dependency updates
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): automated minor/patch dependency updates'
          title: 'chore(deps): automated dependency updates'
          body: |
            ## Automated Dependency Updates

            This PR was created automatically by the dependency-update workflow.

            **Changes:** minor and patch version bumps for npm dependencies.

            **Validation:** security test suite and TypeScript typecheck passed.

            **Review checklist:**
            - [ ] Check `package.json` diff for unexpected major bumps
            - [ ] Verify no breaking changes in updated packages
          branch: chore/automated-dependency-update
          delete-branch: true
          labels: 'dependencies,automated'
