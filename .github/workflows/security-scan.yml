# FormForge security scanning — SAST, dependency audit, secret-leak detection.
name: Security scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Monday 06:00 UTC baseline even without code changes.
    - cron: 0 6 * * 1

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL SAST (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
        with:
          category: /language:javascript-typescript

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js with dependency caching
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      # Gate on what actually ships: dependencies, not the build toolchain.
      #
      # @opennextjs/cloudflare and drizzle-kit are CLIs — their transitive
      # glob/minimatch/esbuild advisories live only in the developer's
      # node_modules and never reach the Worker bundle. They are tracked in
      # devDependencies and kept current by Dependabot; blocking releases on
      # them would mean shipping a known-vulnerable runtime because a minifier
      # has an advisory.
      - name: npm audit — runtime dependencies (high and above fails the build)
        run: npm audit --audit-level=high --omit=dev

      - name: npm audit — full tree (informational)
        if: always()
        run: |
          npm audit --json > npm-audit-full.json || true
          node -e '
            const report = require("./npm-audit-full.json");
            const v = report.metadata?.vulnerabilities ?? {};
            const high = (v.high ?? 0) + (v.critical ?? 0);
            console.log(`Full tree: ${v.total ?? 0} advisories (${high} high/critical).`);
            if (high > 0) {
              console.log("High/critical build-tool advisories (do not ship to the Worker):");
              for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
                if (item.severity === "high" || item.severity === "critical") {
                  console.log(`  ${name} (${item.severity})`);
                }
              }
            }
          '

      - name: Upload full audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-audit-full
          path: npm-audit-full.json
          retention-days: 7
          if-no-files-found: ignore

  secret-scan:
    name: Secret-leak scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for leak scan)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Private-key / token pattern sweep (defense in depth)
        run: |
          # Assembled from adjacent fragments so the detector never matches
          # its own definition in this file.
          SECRET_RE='BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KE''Y|AKIA[0-9A-Z]{16}|xox[bpas]-|sk-li''ve-|rk_li''ve-|ghp_[0-9A-Za-z]{36}|github_pat_[0-9A-Za-z_]{82}'
          if grep -rEn \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            --exclude-dir=.next \
            --exclude-dir=.open-next \
            --exclude='*.map' \
            --exclude='package-lock.json' \
            "$SECRET_RE" . ; then
            echo "::error::Potential committed secret detected"
            exit 1
          fi
          echo "No committed secrets detected."
