# FormForge security scanning — SAST, dependency audit, secret-leak detection.
name: Security scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Monday 06:00 UTC baseline even without code changes.
    - cron: 0 6 * * 1

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL SAST (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js with dependency caching
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: npm audit (high and above fails the build)
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret-leak scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for leak scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Private-key / token pattern sweep (defense in depth)
        run: |
          if grep -rEn --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.next --exclude='"'"'*.map'"'"' \
            '"'"'BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY|AKIA[0-9A-Z]{16}|xox[bpas]-|sk-live-|rk_live-'"'"' .; then
            echo '"'"'Potential committed secret detected.'"'"'
            exit 1
          fi
          echo '"'"'No committed secrets detected.'"'"'
