# Release automation — release-please owns the version, the tag and the Release.
#
# On every push to `main`:
#
#   1. Conventional Commits since the last release are collected.
#   2. A **Release PR** is opened (or updated) that bumps `package.json`,
#      `package-lock.json`, `docs/CHANGELOG.md`, `README.md` and `version.md`.
#      It is never merged automatically — merging it *is* the approval.
#   3. When that PR is merged, release-please creates the `vX.Y.Z` tag and the
#      GitHub Release for exactly the merged commit, then this workflow
#      dispatches `release.yml`, which runs the full gate, generates the SBOM,
#      signs it with cosign and attaches the assets (behind the `release`
#      environment approval).
#
# Two GitHub behaviours are handled explicitly:
#
#   • A PR opened with the default `GITHUB_TOKEN` does **not** trigger
#     `pull_request` workflows. GitHub still creates the runs, but parks them in
#     `action_required`; because they never execute, the required checks stay
#     unreported and the Release PR can never merge. Dispatching `ci.yml` at the
#     branch does *not* help — those check runs belong to the dispatch, not to
#     the PR's rollup. The step below approves the parked runs for the release
#     branch, which starts them against the PR head. Defining a
#     `RELEASE_PLEASE_TOKEN` secret (a fine-grained PAT with `contents` +
#     `pull-requests` write) is the cleaner option: the token is used
#     automatically when present, the PR gets normal `pull_request` events and
#     there is nothing to approve.
#   • A tag pushed with `GITHUB_TOKEN` does **not** trigger `push` workflows,
#     so `release.yml` is started with `workflow_dispatch` (the one event type
#     that is exempt from that suppression), passing the exact tag.
name: Release please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # Required to approve the parked `action_required` runs and to dispatch
  # `release.yml`.
  actions: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PAT makes release-please's own PRs trigger workflows normally.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Approve the checks waiting on the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Discover the branch instead of hard-coding release-please's naming
          # convention, which changes with components and monorepo layouts.
          BRANCH=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-please--")) | .headRefName][0] // ""')

          if [ -z "$BRANCH" ]; then
            echo "::notice::No open release PR — the required checks start on their own."
            exit 0
          fi

          # `action_required` is the state GitHub parks a run in when the actor
          # is not trusted enough to start workflows on its own — which is
          # always the case for a PR opened by `GITHUB_TOKEN`. Approving the run
          # executes it against the PR head, so the required checks finally
          # report and branch protection can evaluate the PR.
          #
          # The runs are created asynchronously after release-please force-pushes
          # the branch, so poll briefly rather than racing them. A release PR
          # that already has its checks running simply falls through.
          RUNS=""
          for _attempt in $(seq 1 12); do
            RUNS=$(gh api \
              "repos/$GH_REPO/actions/runs?branch=$BRANCH&status=action_required&per_page=100" \
              --jq '.workflow_runs[] | select(.event == "pull_request") | .id')
            if [ -n "$RUNS" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$RUNS" ]; then
            echo "::notice::Nothing waiting for approval on $BRANCH."
            exit 0
          fi

          while IFS= read -r RUN_ID; do
            [ -z "$RUN_ID" ] && continue
            # A run that started or finished between the list and the approve
            # call returns 403/404; that is benign, not a failed release.
            if gh api -X POST "repos/$GH_REPO/actions/runs/$RUN_ID/approve" >/dev/null; then
              echo "Approved run $RUN_ID for $BRANCH."
            else
              echo "::warning::Run $RUN_ID was already started or finished."
            fi
          done <<< "$RUNS"

      - name: Dispatch the release pipeline for the new tag
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "::error::release-please reported a release without a tag name"
            exit 1
          fi
          gh workflow run release.yml --ref main -f version="$TAG"
          echo "Dispatched the Release pipeline for $TAG."

      - name: Write summary
        if: steps.release.outputs.release_created == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          {
            echo "## 🚀 Released \`$TAG\`"
            echo ""
            echo "The tag and GitHub Release were created by release-please for the"
            echo "merged Release PR. The \`Release\` workflow now runs the full gate,"
            echo "generates and signs the SBOM, and attaches the assets."
          } >> "$GITHUB_STEP_SUMMARY"
