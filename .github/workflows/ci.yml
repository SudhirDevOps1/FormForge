# FormForge CI — typecheck, zero-warning lint, automated unit & security tests,
# and Cloudflare build verification. EXTENDS the original structure; does not replace it.
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  # release-please opens its Release PR with `GITHUB_TOKEN`, which does not
  # produce `pull_request` events. Dispatching this workflow on that branch
  # still reports every required check against its head commit.
  workflow_dispatch:

# Superseded PR runs are cancelled; main-branch runs always complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ── 1. Lint + Typecheck ───────────────────────────────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22 with npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (ci)
        run: npm ci --no-audit --no-fund

      - name: Strict TypeScript typecheck
        run: npm run typecheck

      - name: ESLint — zero warnings allowed
        run: npm run lint

      - name: Write CI summary
        if: always()
        run: |
          echo "## 🔍 Lint & Typecheck" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ---- | ------ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| TypeScript \`tsc --noEmit\` | ${{ job.status == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ESLint (zero warnings) | ${{ job.status == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"

  # ── 2. Security Tests ─────────────────────────────────────────────────────
  test:
    name: Security Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22 with npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (ci)
        run: npm ci --no-audit --no-fund

      - name: Run comprehensive security & unit test suite
        run: npm run test:security

      - name: Run feature-behaviour test suite
        run: npm run test:features

      - name: Validate the GitHub Action pins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run test:pins

      - name: Write test summary
        if: always()
        run: |
          echo "## 🧪 Security Test Suite" >> "$GITHUB_STEP_SUMMARY"
          echo "Covers: Cryptographic invariants (P1), Injection & XSS (P2), SSRF (P3), Auth & abuse (P4), PII & encryption (P5), Repo hygiene (P6), v1.1 new-feature security (P7)" >> "$GITHUB_STEP_SUMMARY"
          echo "## 🧩 Feature Test Suite" >> "$GITHUB_STEP_SUMMARY"
          echo "Covers: Conditional logic (F1), Prefill & hidden fields (F2), Webhook retry policy (F3), Duplicate detection (F4), Form password gate (F5), Password strength policy (F6), Payload encryption (F7)" >> "$GITHUB_STEP_SUMMARY"

  # ── 2b. End-to-end integration tests ────────────────────────────────
  e2e:
    name: End-to-end integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22 with npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (ci)
        run: npm ci --no-audit --no-fund

      - name: Start the server
        env:
          AUTH_SECRET: ci-e2e-placeholder-secret-value-000000000000
          ALLOW_REGISTRATION: "true"
          DATABASE_URL: "file:./.tmp-e2e/formforge.db"
        run: |
          mkdir -p .tmp-e2e
          npm run dev -- --port 3100 > .tmp-e2e/server.log 2>&1 &
          echo "FF_SERVER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for the server to accept requests
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:3100/api/health" > /dev/null; then
              echo "Server is up."
              exit 0
            fi
            sleep 2
          done
          echo "The server did not start in time:"
          cat .tmp-e2e/server.log
          exit 1

      - name: Run the end-to-end suite
        run: node tests/run-e2e-tests.mjs http://127.0.0.1:3100

      - name: Stop the server
        if: always()
        run: kill "$FF_SERVER_PID" || true

      - name: Write E2E summary
        if: always()
        run: |
          echo "## 🧪 End-to-end integration tests" >> "$GITHUB_STEP_SUMMARY"
          echo "Exercises the real HTTP surface: registration, conditional logic, prefill, partial submissions, workflow, encryption at rest, export, the password gate, duplicate detection, sessions and the audit trail." >> "$GITHUB_STEP_SUMMARY"

  # ── 3. Build (Cloudflare/OpenNext) ────────────────────────────────────────
  build:
    name: Cloudflare Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22 with npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (ci)
        run: npm ci --no-audit --no-fund

      - name: Cache OpenNext build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.0
        id: build-cache
        with:
          path: |
            .next
            .open-next
          key: build-${{ runner.os }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts', 'open-next.config.ts', 'package-lock.json') }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: Build (OpenNext → Cloudflare Workers)
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: npm run build
        env:
          # Placeholder only — build process does not need real runtime secrets
          AUTH_SECRET: ci-build-placeholder-not-a-real-secret-64-chars-long-00000000

      - name: Upload build artifact (.open-next)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare-build-${{ github.sha }}
          path: .open-next/
          retention-days: 7
          if-no-files-found: error
          # .open-next begins with a dot, so upload-artifact treats it as a
          # hidden path and skipped it entirely ("No files were found"),
          # failing the build job even though the bundle was written.
          include-hidden-files: true

      # A green `next build` does not prove the Worker serves. Next.js 16 and
      # the OpenNext adapter can disagree about runtime manifests, which made
      # every page answer 500 (Error 1101) in production while the build and
      # the unit tests were both green. This step boots the real bundle.
      - name: Smoke test the Worker bundle
        run: npm run test:worker

      - name: Write build summary
        if: always()
        run: |
          echo "## 🏗️ Cloudflare Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime: OpenNext → Cloudflare Workers" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: \`cloudflare-build-${{ github.sha }}\` (7 day retention)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker smoke test: the bundle is booted under \`wrangler dev\` and must serve 200" >> "$GITHUB_STEP_SUMMARY"

  # ── 4. Migration Lint (Drizzle schema check) ──────────────────────────────
  migration-check:
    name: Drizzle Migration Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22 with npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (ci)
        run: npm ci --no-audit --no-fund

      - name: Verify migration directory is non-empty and consistent
        run: |
          echo "=== Migration files in repo ==="
          ls -la migrations/
          SQL_COUNT=$(find migrations/ -name '*.sql' | wc -l)
          if [ "$SQL_COUNT" -eq 0 ]; then
            echo "ERROR: No .sql migration files found in migrations/!"
            exit 1
          fi
          echo "Found $SQL_COUNT migration file(s) — OK"

      - name: Write migration summary
        if: always()
        run: |
          echo "## 🗄️ Migration Check (Drizzle / D1 SQLite)" >> "$GITHUB_STEP_SUMMARY"
          echo "Schema: \`src/db/schema.ts\` | Dialect: SQLite | Migrations: \`migrations/\`" >> "$GITHUB_STEP_SUMMARY"
