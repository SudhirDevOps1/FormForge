# FormForge CI — typecheck, zero-warning lint, automated unit & security tests,
# and Cloudflare build verification. EXTENDS the original structure; does not replace it.
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

# Superseded PR runs are cancelled; main-branch runs always complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ── 1. Lint + Typecheck ───────────────────────────────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22 with npm cache
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (ci)
        run: npm ci --no-audit --no-fund

      - name: Strict TypeScript typecheck
        run: npm run typecheck

      - name: ESLint — zero warnings allowed
        run: npm run lint

      - name: Write CI summary
        if: always()
        run: |
          echo "## 🔍 Lint & Typecheck" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ---- | ------ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| TypeScript \`tsc --noEmit\` | ${{ job.status == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ESLint (zero warnings) | ${{ job.status == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"

  # ── 2. Security Tests ─────────────────────────────────────────────────────
  test:
    name: Security Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22 with npm cache
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (ci)
        run: npm ci --no-audit --no-fund

      - name: Run comprehensive security & unit test suite
        run: npm run test:security

      - name: Write test summary
        if: always()
        run: |
          echo "## 🧪 Security Test Suite" >> "$GITHUB_STEP_SUMMARY"
          echo "Covers: Cryptographic invariants (P1), Injection & XSS (P2), SSRF (P3), Auth & abuse (P4), PII & encryption (P5), Repo hygiene (P6)" >> "$GITHUB_STEP_SUMMARY"

  # ── 3. Build (Cloudflare/OpenNext) ────────────────────────────────────────
  build:
    name: Cloudflare Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22 with npm cache
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (ci)
        run: npm ci --no-audit --no-fund

      - name: Cache OpenNext build outputs
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c6158d # v4.2.0
        id: build-cache
        with:
          path: |
            .next
            .open-next
          key: build-${{ runner.os }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts', 'open-next.config.ts', 'package-lock.json') }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: Build (OpenNext → Cloudflare Workers)
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: npm run build
        env:
          # Placeholder only — build process does not need real runtime secrets
          AUTH_SECRET: ci-build-placeholder-not-a-real-secret-64-chars-long-00000000

      - name: Upload build artifact (.open-next)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudflare-build-${{ github.sha }}
          path: .open-next/
          retention-days: 7
          if-no-files-found: error

      - name: Write build summary
        if: always()
        run: |
          echo "## 🏗️ Cloudflare Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime: OpenNext → Cloudflare Workers" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: \`cloudflare-build-${{ github.sha }}\` (7 day retention)" >> "$GITHUB_STEP_SUMMARY"

  # ── 4. Migration Lint (Drizzle schema check) ──────────────────────────────
  migration-check:
    name: Drizzle Migration Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22 with npm cache
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (ci)
        run: npm ci --no-audit --no-fund

      - name: Verify migration directory is non-empty and consistent
        run: |
          echo "=== Migration files in repo ==="
          ls -la migrations/
          SQL_COUNT=$(find migrations/ -name '*.sql' | wc -l)
          if [ "$SQL_COUNT" -eq 0 ]; then
            echo "ERROR: No .sql migration files found in migrations/!"
            exit 1
          fi
          echo "Found $SQL_COUNT migration file(s) — OK"

      - name: Write migration summary
        if: always()
        run: |
          echo "## 🗄️ Migration Check (Drizzle / D1 SQLite)" >> "$GITHUB_STEP_SUMMARY"
          echo "Schema: \`src/db/schema.ts\` | Dialect: SQLite | Migrations: \`migrations/\`" >> "$GITHUB_STEP_SUMMARY"
