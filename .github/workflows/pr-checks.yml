# FormForge PR Quality Gates — conventional commits, PR size labeling, path labels.
name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── 1. Conventional Commit Title ───────────────────────────────────────
  conventional-commit:
    name: PR Title — Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor != 'dependabot[bot]'
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title follows Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Allowed types from commitlint.config.mjs (conventional preset)
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?(!)?: .{1,100}$'
          if echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "PR title is valid: $PR_TITLE"
          else
            echo "::error::PR title does not follow Conventional Commits: $PR_TITLE"
            echo "Expected format: type(scope)!: description"
            echo "Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi

  # ── 2. PR Size Labeler ─────────────────────────────────────────────────
  pr-size:
    name: PR Size Label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor != 'dependabot[bot]'
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Label PR by changed line count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ADDITIONS=${{ github.event.pull_request.additions }}
          DELETIONS=${{ github.event.pull_request.deletions }}
          TOTAL=$((ADDITIONS + DELETIONS))
          echo "PR changes: +$ADDITIONS / -$DELETIONS = $TOTAL total"

          if [ "$TOTAL" -lt 10 ]; then SIZE="size/XS"
          elif [ "$TOTAL" -lt 50 ]; then SIZE="size/S"
          elif [ "$TOTAL" -lt 250 ]; then SIZE="size/M"
          elif [ "$TOTAL" -lt 1000 ]; then SIZE="size/L"
          else SIZE="size/XL"
          fi

          # Remove all size labels then apply the correct one
          for LABEL in "size/XS" "size/S" "size/M" "size/L" "size/XL"; do
            gh pr edit "$PR_NUMBER" --remove-label "$LABEL" 2>/dev/null || true
          done
          gh pr edit "$PR_NUMBER" --add-label "$SIZE" 2>/dev/null || \
            gh label create "$SIZE" --color "0075ca" 2>/dev/null && \
            gh pr edit "$PR_NUMBER" --add-label "$SIZE"

          if [ "$SIZE" = "size/XL" ]; then
            gh pr comment "$PR_NUMBER" --body "⚠️ **Large PR (XL):** This PR has $TOTAL changed lines. Consider splitting into smaller PRs for easier review."
          fi

  # ── 3. Path-based Label Automation ────────────────────────────────────
  label-automation:
    name: Auto-label by Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Auto-label PR based on file paths
        uses: actions/labeler@8558fd74291d67161a8a6ce9bfa3f5e2462e3c2e # v5.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
