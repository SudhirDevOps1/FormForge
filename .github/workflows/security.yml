# FormForge Security Pipeline — CodeQL SAST, dependency audit, secret scanning,
# Semgrep semantic analysis, and license compliance.
# EXTENDS the existing security-scan.yml; does NOT replace it.
name: Security

on:
  push:
    branches: [main, master, develop]
  pull_request:
  schedule:
    - cron: '0 2 * * 1'   # Weekly Monday 02:00 UTC

permissions:
  contents: read

jobs:
  # ── 1. CodeQL SAST (security-extended) ──────────────────────────────────
  codeql:
    name: CodeQL SAST (security-extended)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Initialize CodeQL
        uses: github/codeql-action/init@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
        with:
          category: /language:javascript-typescript
          upload: true

  # ── 2. Dependency Vulnerability Audit ───────────────────────────────────
  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: npm audit (high severity, prod deps only)
        run: npm audit --audit-level=high --omit=dev

      - name: npm audit full JSON report (informational)
        if: always()
        run: npm audit --json > npm-audit-report.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: npm-audit-report-${{ github.sha }}
          path: npm-audit-report.json
          retention-days: 30
          if-no-files-found: ignore

  # ── 3. Secret Scanning ──────────────────────────────────────────────────
  secret-scan:
    name: Secret Leak Detection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout (full history for leak scan)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Gitleaks — scan full repo history
        uses: gitleaks/gitleaks-action@44c470fca3f7025d927acde4a73d0e64e9e97c02 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Defense-in-depth pattern sweep
        run: |
          FOUND=0
          if grep -rEn \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            --exclude-dir=.next \
            --exclude-dir=.open-next \
            --exclude="*.map" \
            --exclude="package-lock.json" \
            'BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY|AKIA[0-9A-Z]{16}|xox[bpas]-[0-9A-Za-z-]+|sk-live-|rk_live-|ghp_[0-9A-Za-z]{36}|github_pat_[0-9A-Za-z_]{82}' . ; then
            echo "::error::Potential committed secret detected"
            FOUND=1
          fi
          [ "$FOUND" -eq 0 ] || exit 1
          echo "No committed secrets detected."

  # ── 4. Semgrep SAST ─────────────────────────────────────────────────────
  sast-semgrep:
    name: Semgrep SAST (OWASP + Node.js)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Semgrep scan
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1.1.0
        with:
          config: >
            p/security-audit
            p/owasp-top-ten
            p/jwt
            p/sql-injection
            p/xss
            p/nodejs
          generateSarif: '1'
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ── 5. License Compliance ────────────────────────────────────────────────
  license-check:
    name: License Compliance (no copyleft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install license-checker
        run: npm install --no-save license-checker

      - name: Fail on copyleft licenses in prod deps
        run: |
          npx license-checker --production --excludePrivatePackages \
            --failOn "GPL;AGPL;LGPL;GPL-2.0;GPL-3.0;AGPL-3.0;LGPL-2.0;LGPL-2.1;LGPL-3.0" \
            --out license-report.json --json
          echo "No copyleft licenses found in production dependencies"

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: license-report-${{ github.sha }}
          path: license-report.json
          retention-days: 30
          if-no-files-found: ignore
