# FormForge Security Pipeline — CodeQL SAST, dependency audit, secret scanning,
# Semgrep semantic analysis, and license compliance.
# EXTENDS the existing security-scan.yml; does NOT replace it.
name: Security

on:
  push:
    branches: [main, master, develop]
  pull_request:
  schedule:
    - cron: '0 2 * * 1'   # Weekly Monday 02:00 UTC

permissions:
  contents: read

jobs:
  # ── 1. CodeQL SAST (security-extended) ──────────────────────────────────
  codeql:
    name: CodeQL SAST (security-extended)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
          upload: true

  # ── 2. Dependency Vulnerability Audit ───────────────────────────────────
  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: npm audit (high severity, prod deps only)
        run: npm audit --audit-level=high --omit=dev

      - name: npm audit full JSON report (informational)
        if: always()
        run: npm audit --json > npm-audit-report.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-audit-report-${{ github.sha }}
          path: npm-audit-report.json
          retention-days: 30
          if-no-files-found: ignore

  # ── 3. Secret Scanning ──────────────────────────────────────────────────
  secret-scan:
    name: Secret Leak Detection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout (full history for leak scan)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Gitleaks — scan full repo history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Defense-in-depth pattern sweep
        run: |
          # The pattern is assembled from adjacent shell fragments on purpose.
          # Written as one literal it appears verbatim in this file, so the
          # sweep would report its own definition as a leaked secret.
          SECRET_RE='BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KE''Y|AKIA[0-9A-Z]{16}|xox[bpas]-[0-9A-Za-z-]+|sk-li''ve-|rk_li''ve-|ghp_[0-9A-Za-z]{36}|github_pat_[0-9A-Za-z_]{82}'
          if grep -rEn \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            --exclude-dir=.next \
            --exclude-dir=.open-next \
            --exclude="*.map" \
            --exclude="package-lock.json" \
            "$SECRET_RE" . ; then
            echo "::error::Potential committed secret detected"
            exit 1
          fi
          echo "No committed secrets detected."

  # ── 4. Semgrep SAST ─────────────────────────────────────────────────────
  sast-semgrep:
    name: Semgrep SAST (OWASP + Node.js)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Semgrep
        run: |
          # semgrep-action@v1.1.0 (2021) bundles a Semgrep too old to parse
          # modern registry rule metadata and crashes with
          # "invalid rule severity value: MEDIUM" before it scans anything.
          # Run the current CLI directly instead. pipx avoids PEP 668's
          # externally-managed-environment error on the runner's system Python.
          if command -v pipx >/dev/null 2>&1; then
            pipx install semgrep
          else
            python3 -m pip install --user --quiet semgrep
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Semgrep scan (SARIF for code scanning)
        run: |
          semgrep scan \
            --metrics=off \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/jwt \
            --config p/sql-injection \
            --config p/xss \
            --config p/nodejs \
            --severity ERROR \
            --error \
            --sarif --output semgrep.sarif \
            src/

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ── 5. License Compliance ────────────────────────────────────────────────
  license-check:
    name: License Compliance (no copyleft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # In-repo, dependency-free check. `license-checker` reaches the tree via
      # `read-package-json`, which calls `glob()` as a plain function (glob@7
      # API). With this project's patched-glob overrides it crashes, and when
      # installed in isolation it exits 0 without writing a report at all — a
      # gate that cannot fail. `scripts/check-licenses.mjs` reads the entries in
      # `package-lock.json` (what `npm ci` actually installs), ignores dev-only
      # packages and fails on GPL/AGPL/LGPL in production dependencies.
      - name: Fail on copyleft licenses in prod deps
        run: npm run test:licenses

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: license-report-${{ github.sha }}
          path: license-report.json
          retention-days: 30
          if-no-files-found: ignore
