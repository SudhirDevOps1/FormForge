# FormForge release pipeline.
#
# Versioning is owned by `release-please` (`.github/workflows/release-please.yml`):
# it opens a Release PR from Conventional Commits, and merging that PR is the
# approval. On merge it creates the `vX.Y.Z` tag plus the GitHub Release, then
# dispatches this workflow with the exact tag.
#
# This workflow is the *publication* gate for that tag:
#
#   validate-tag → the tag must match `package.json`
#   ci-gate      → typecheck, lint, security suite and a real Worker build
#   create-release → SBOM + cosign signature attached to the Release
#
# `create-release` runs in the `release` environment, so the owner can require
# a final manual review before signed assets are published. A `v*.*.*` tag
# pushed by hand still triggers the same gate.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to publish, e.g. v1.2.0 (set by release-please.yml)'
        type: string
        required: true
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-pipeline-lock
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}

jobs:
  # ── 1. Validate the tag matches package.json ──────────────────────────
  validate-tag:
    name: Validate Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout the release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify tag matches package.json version
        run: |
          TAG="${RELEASE_TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Tag $RELEASE_TAG matches package.json version $PKG_VERSION"

  # ── 2. Full CI gate before anything ships ─────────────────────────────
  ci-gate:
    name: Full CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [validate-tag]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Security tests
        run: npm run test:security

      - name: Build (Cloudflare/OpenNext)
        run: npm run build
        env:
          AUTH_SECRET: ci-release-gate-placeholder-not-a-real-secret-00000000

  # ── 3. Publish (environment `release` = manual approval) ──────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ci-gate]
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout the release (full history for the changelog)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Extract the changelog section for this tag
        run: |
          node .github/scripts/extract-changelog.mjs "$RELEASE_TAG" > release-notes.md
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: formforge-${{ env.RELEASE_TAG }}-sbom.spdx.json
          output-file: ./formforge-sbom.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.8.1

      - name: Sign the SBOM (Sigstore keyless OIDC)
        run: |
          cosign sign-blob --yes ./formforge-sbom.spdx.json \
            --bundle formforge-sbom.spdx.json.bundle
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: FormForge ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            docs/CHANGELOG.md
            CHANGELOG.md
            formforge-sbom.spdx.json
            formforge-sbom.spdx.json.bundle
