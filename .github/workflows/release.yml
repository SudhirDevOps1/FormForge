# FormForge release pipeline.
#
# Two ways to publish, both approval-gated:
#
#   1. Recommended — Actions → "Release" → Run workflow, pick a bump.
#      A release PR is opened with the version bump + a changelog section
#      generated from the commits since the last tag. Merging that PR is the
#      approval: `release-tag.yml` then tags the merge commit and dispatches
#      this workflow with the exact version (`version` input), which runs the
#      full gate and publishes the GitHub Release.
#
#   2. Manual — push a `v*.*.*` tag yourself (see docs/RELEASES.md).
#
# Publication is additionally gated by the `release` environment, so the
# repository owner can require a manual review before assets are attached.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump to prepare (ignored when "version" is set)'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: 'Exact version to publish, e.g. v1.2.0 (set by release-tag.yml)'
        type: string
        required: false
      dry_run:
        description: 'Only compute the next version — do not open a release PR'
        type: boolean
        default: false
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.event_name }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}

jobs:
  # ── 1. Plan (dispatch without an explicit version) ────────────────────
  plan:
    name: Plan Release
    if: github.event_name == 'workflow_dispatch' && inputs.version == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Compute the next version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: node .github/scripts/next-version.mjs "$BUMP" >> "$GITHUB_OUTPUT"

      - name: Write summary
        run: |
          {
            echo "## 📦 Release plan"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Previous version | \`${{ steps.next.outputs.previous }}\` |"
            echo "| Next version | \`${{ steps.next.outputs.version }}\` |"
            echo "| Tag | \`${{ steps.next.outputs.tag }}\` |"
            echo "| Dry run | \`${{ inputs.dry_run }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 2. Open the release PR (the approval gate) ────────────────────────
  open-release-pr:
    name: Open Release PR
    needs: [plan]
    if: github.event_name == 'workflow_dispatch' && inputs.version == '' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Bump version + write changelog section
        run: node .github/scripts/prepare-release.mjs "${{ needs.plan.outputs.version }}"

      - name: Commit, push and open the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="release/${TAG}"
          git switch -c "$BRANCH"
          git add package.json package-lock.json docs/CHANGELOG.md
          git commit -m "chore(release): ${TAG}"
          git push origin "$BRANCH"

          node .github/scripts/extract-changelog.mjs "$TAG" > release-notes.md
          {
            echo "## ${TAG}"
            echo ""
            echo "Approving this release means: **merge this PR**."
            echo ""
            echo "On merge, \`release-tag.yml\` tags the merged commit, then this"
            echo "workflow runs its full gate and publishes the GitHub Release."
            echo ""
            echo "---"
            echo ""
            cat release-notes.md
          } > pr-body.md

          gh pr create --base main --head "$BRANCH" \
            --title "chore(release): ${TAG}" \
            --body-file pr-body.md
          gh pr merge "$BRANCH" --auto --squash --delete-branch || \
            echo "::notice::Auto-merge is not enabled on this repository; merge the PR to approve the release."

  # ── 3. Validate the tag matches package.json ──────────────────────────
  validate-tag:
    name: Validate Tag
    if: github.event_name == 'push' || inputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout the release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify tag matches package.json version
        run: |
          TAG="${RELEASE_TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Tag $RELEASE_TAG matches package.json version $PKG_VERSION"

  # ── 4. Full CI gate before anything ships ─────────────────────────────
  ci-gate:
    name: Full CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [validate-tag]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Security tests
        run: npm run test:security

      - name: Build (Cloudflare/OpenNext)
        run: npm run build
        env:
          AUTH_SECRET: ci-release-gate-placeholder-not-a-real-secret-00000000

  # ── 5. Publish (environment `release` = manual approval) ──────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ci-gate]
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout the release (full history for the changelog)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Extract the changelog section for this tag
        run: |
          node .github/scripts/extract-changelog.mjs "$RELEASE_TAG" > release-notes.md
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: formforge-${{ env.RELEASE_TAG }}-sbom.spdx.json
          output-file: ./formforge-sbom.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.8.1

      - name: Sign the SBOM (Sigstore keyless OIDC)
        run: |
          cosign sign-blob --yes ./formforge-sbom.spdx.json \
            --bundle formforge-sbom.spdx.json.bundle
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: FormForge ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            docs/CHANGELOG.md
            CHANGELOG.md
            formforge-sbom.spdx.json
            formforge-sbom.spdx.json.bundle
