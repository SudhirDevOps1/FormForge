# FormForge release — triggered by v* tags.
# Extends original: adds tag validation, full CI gate, SBOM, and signed release.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write   # for sigstore/cosign OIDC signing

jobs:
  # ── 1. Validate Tag matches package.json version ────────────────────────
  validate-tag:
    name: Validate Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package.json version $PKG_VERSION"

  # ── 2. Full CI Gate ────────────────────────────────────────────────────
  ci-gate:
    name: Full CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [validate-tag]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Security tests
        run: npm run test:security

      - name: Build (Cloudflare/OpenNext)
        run: npm run build
        env:
          AUTH_SECRET: ci-release-gate-placeholder-not-a-real-secret-00000000

  # ── 3. Create Release with SBOM ───────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ci-gate]
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Extract changelog notes for this tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node .github/scripts/extract-changelog.mjs "$TAG_NAME" > release-notes.md
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Generate SBOM
        uses: anchore/sbom-action@e11c554f704a0b820cbf8c51673f6945e0731532 # v0.20.0
        with:
          path: .
          format: spdx-json
          artifact-name: formforge-${{ github.ref_name }}-sbom.spdx.json
          output-file: ./formforge-sbom.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e2b10 # v3.8.1

      - name: Sign SBOM with Sigstore (keyless OIDC)
        run: |
          cosign sign-blob --yes ./formforge-sbom.spdx.json \
            --bundle formforge-sbom.spdx.json.bundle
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            docs/CHANGELOG.md
            CHANGELOG.md
            formforge-sbom.spdx.json
            formforge-sbom.spdx.json.bundle
