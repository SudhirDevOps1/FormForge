# Dependabot configuration for FormForge.
# Minor/patch updates are grouped; major bumps get individual PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: UTC
    open-pull-requests-limit: 10
    reviewers:
      - SudhirDevOps1
    labels:
      - dependencies
      - automated
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - '*'
        exclude-patterns:
          - 'next'
          - 'react'
          - 'react-dom'
          - 'typescript'
          - 'wrangler'
          - '@opennextjs/cloudflare'
          - 'drizzle-orm'
          - 'drizzle-kit'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
      - automated
